<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marco Maroni — Archivio Twitter</title>
  <meta name="description" content="Archivio pubblico dei tweet di @marcomaroni (2008–2024)">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════════════════════ -->
<div id="app" class="app-layout">

  <!-- ── Sidebar ── -->
  <aside id="sidebar" class="sidebar">

    <!-- Profile -->
    <div class="profile-card">
      <div class="profile-header-img">
        <img id="profile-header" src="" alt="" class="header-image" onerror="this.style.display='none'">
      </div>
      <div class="profile-avatar-wrap">
        <img id="profile-avatar" src="assets/images/defaultAvatar.svg" alt="Avatar" class="profile-avatar">
      </div>
      <div class="profile-info">
        <h1 id="profile-name" class="profile-name">Marco Maroni</h1>
        <p id="profile-username" class="profile-username">@marcomaroni</p>
        <p id="profile-bio" class="profile-bio"></p>
        <p id="profile-website" class="profile-website"></p>
        <p id="profile-since" class="profile-since"></p>
        <div id="profile-stats" class="profile-stats">
          <div class="stat">
            <span id="stat-tweets" class="stat-value">—</span>
            <span class="stat-label">Tweet</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div class="nav-section-title">Naviga per anno</div>
      <ul id="year-nav" class="year-nav">
        <!-- Populated by JS -->
        <li class="nav-loading">Caricamento…</li>
      </ul>
    </nav>

    <!-- Footer -->
    <footer class="sidebar-footer">
      <p>Archivio Twitter di @marcomaroni</p>
      <p>Esportato: aprile 2024</p>
    </footer>

  </aside>

  <!-- ── Main column ── -->
  <main id="main" class="main-column">

    <!-- Search bar -->
    <div class="search-bar-wrap">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <g><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/></g>
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Cerca nei tweet…"
          autocomplete="off"
          spellcheck="false"
        >
        <button id="search-clear" class="search-clear" aria-label="Cancella ricerca" style="display:none">✕</button>
      </div>
    </div>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar"></div>

    <!-- Tweet list -->
    <div id="tweet-list" class="tweet-list">
      <div class="loading-placeholder">
        <div class="spinner"></div>
        <p>Caricamento archivio…</p>
      </div>
    </div>

    <!-- Load more -->
    <div id="load-more-wrap" style="display:none" class="load-more-wrap">
      <button id="load-more" class="load-more-btn">Carica altri tweet</button>
    </div>

    <!-- No results -->
    <div id="no-results" class="no-results" style="display:none">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="no-results-icon">
        <g><path d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"/></g>
      </svg>
      <p id="no-results-msg">Nessun risultato trovato.</p>
    </div>

  </main>

</div>

<!-- ── Mobile sidebar toggle ── -->
<button id="sidebar-toggle" class="sidebar-toggle" aria-label="Menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></g></svg>
</button>

<script src="assets/js/app.js"></script>
</body>
</html>
